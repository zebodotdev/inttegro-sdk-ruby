name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'zebodotdev/inttegro-sdk-ruby'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the OpenAPI contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zebodotdev/openapi
          ref: master
          path: openapi
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"
          bundler: "2.6.6"
          bundler-cache: true

      - name: Verify the release tag and gem version
        shell: bash
        run: |
          set -euo pipefail
          gem_version="$(ruby -Ilib -rinttegro/version -e 'print Inttegro::VERSION')"
          test "${GITHUB_REF_NAME}" = "v${gem_version}"
          test "$(git rev-list -n 1 "${GITHUB_REF_NAME}")" = "${GITHUB_SHA}"

      - name: Run the complete release checks
        env:
          INTTEGRO_OPENAPI_SPEC: openapi/commerce.yml
        run: bundle exec rake

      - name: Publish to RubyGems with OIDC and Sigstore provenance
        uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1
        with:
          attestations: true
          await-release: true

      - name: Inspect the published gem artifact
        shell: bash
        run: |
          set -euo pipefail
          test "$(find pkg -maxdepth 1 -name '*.gem' | wc -l | tr -d ' ')" = "1"
          gem specification pkg/*.gem --yaml > pkg/GEM-METADATA.yml

      - name: Attest the gem
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: pkg/*.gem

      - name: Record release provenance and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp pkg/*.gem pkg/GEM-METADATA.yml artifacts/
          cp "${{ steps.attest.outputs.bundle-path }}" artifacts/ATTESTATION.sigstore.jsonl
          {
            echo "repository=https://github.com/${GITHUB_REPOSITORY}"
            echo "tag=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "workflow=${GITHUB_WORKFLOW_REF}"
          } > artifacts/PROVENANCE.txt
          (
            cd artifacts
            sha256sum ./*.gem ./ATTESTATION.sigstore.jsonl ./GEM-METADATA.yml ./PROVENANCE.txt > SHA256SUMS
          )

      - name: Publish the immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" artifacts/*
          --generate-notes
          --title "Inttegro Ruby SDK ${GITHUB_REF_NAME}"
          --verify-tag
