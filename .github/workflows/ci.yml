name: Ruby SDK CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      INTTEGRO_OPENAPI_SPEC: openapi/commerce.yml
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.0", "3.1", "3.2", "3.3"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout OpenAPI contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zebodotdev/openapi
          ref: d8e3b5ab2ac0d24d9edb4a24fdad7b9815cc803b
          path: openapi
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: "2.5.23"
          bundler-cache: true

      - name: Run tests
        run: COVERAGE=1 bundle exec rake test

      - name: Run Sorbet
        run: bundle exec rake sorbet

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457 # v3
        with:
          file: coverage/.resultset.json
          flags: ruby
          name: ruby-sdk
